name: brew test-bot

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    steps:
    - name: Set up Homebrew
      id: set-up-homebrew
      uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # To fix circular dependency issue, see:
    # https://github.com/homebrew-ffmpeg/homebrew-ffmpeg/issues/13
    - name: Remove chromaprint from ffmpeg formula
      working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
      run: |
        grep -v chromaprint Formula/ffmpeg.rb > Formula/ffmpeg.rb.tmp
        mv Formula/ffmpeg.rb.tmp Formula/ffmpeg.rb

    - name: Cache Homebrew Bundler RubyGems
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.set-up-homebrew.outputs.gems-path }}
        key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
        restore-keys: ${{ matrix.os }}-rubygems-

    # Run test-bot as separate steps, mirroring `brew tap-new` output. Each
    # `brew test-bot` invocation re-establishes tap trust, so the cleanup step
    # cannot wipe the trust marker before `brew doctor` runs. See:
    # https://github.com/Homebrew/brew/issues/22775
    - run: brew test-bot --only-cleanup-before

    - run: brew test-bot --only-setup

    - run: brew test-bot --only-tap-syntax

    - run: brew test-bot --only-formulae
      if: github.event_name == 'pull_request'

    - name: Upload bottles as artifact
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bottles_${{ matrix.os }}
        path: '*.bottle.*'

  test-with-options:
    if: github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ' '), 'test:')
    strategy:
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]

    steps:
    - name: Set up Homebrew
      id: set-up-homebrew
      uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

    - name: Remove chromaprint from ffmpeg formula
      working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
      run: |
        grep -v chromaprint Formula/ffmpeg.rb > Formula/ffmpeg.rb.tmp
        mv Formula/ffmpeg.rb.tmp Formula/ffmpeg.rb

    - name: Determine build flags from labels
      id: flags
      uses: actions/github-script@v7
      with:
        script: |
          const labels = context.payload.pull_request.labels.map(l => l.name);
          const flags = labels
            .filter(l => l.startsWith('test:'))
            .map(l => '--with-' + l.replace('test:', ''));
          const result = flags.join(' ');
          core.info(`Build flags: ${result}`);
          core.setOutput('flags', result);

    - name: Install with flags
      working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
      run: brew install --verbose --build-from-source ./Formula/ffmpeg.rb ${{ steps.flags.outputs.flags }}

    - name: Test
      working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
      run: brew test ./Formula/ffmpeg.rb
